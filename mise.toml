# DominantColors — toolchain and environment.
# Erlang/Elixir are pinned to match the other ex/* repositories in arca.

# The NIF under native/dominantcolors is built locally with Rust on every
# `mix compile`; there are no precompiled binaries.

[tools]
erlang = "29.0.6"
elixir = "1.20.4-otp-29"
rust = "stable"

[env]
MIX_ENV = "{{ env.MIX_ENV | default(value='dev') }}"
